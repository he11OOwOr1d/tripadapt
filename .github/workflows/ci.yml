name: Scaffold checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tripadapt
          POSTGRES_PASSWORD: tripadapt
          POSTGRES_DB: tripadapt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tripadapt -d tripadapt"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"
      - run: make setup
      - run: make migrate
      - run: cd services/backend && uv run alembic check
      - run: make check

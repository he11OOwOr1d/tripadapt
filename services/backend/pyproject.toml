[project]
name = "tripadapt-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "certifi>=2026.10.23",
    "fastapi>=0.162.1",
    "groq>=1.7.0",
    "langgraph>=1.2.20",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
